{% extends "base.html" %}
{% block content %}
    <form action="/edit/{{ blog_id }}">
        <div class="inputs">
            <div id="title" class="single_input">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" placeholder="New Blog">
            </div>
            <div class="spacer"></div>
            <div id="content" class="single_input">
                <label for="content">Content</label>
                <input type="text" name="content" id="content">
            </div>
        </div>
        <button class="clickable" id="green">Update</button>
    </form>
    <a href="/" id="gray" class="clickable margin_top">Cancel</a>
{% endblock %}
